# The shared Rust crate of the CodeBrix.WebPlatform web application platform. It ships inside the
# CodeBrix.WebPlatform.FrontendBuilder NuGet package and is written into each application's
# frontend when the frontend is built; it is build output there and is never edited in an
# application.
[package]
name = "codebrix-webplatform"
version = "1.0.0"
edition = "2021"
publish = false
description = "Shared frontend code of the CodeBrix.WebPlatform web application platform: the one set-up call, REST transport, SignalR client, error type, query strings, calendar dates and browser helpers."
license = "Apache-2.0"

[dependencies]
# The versions below are the platform's: an application's frontend uses the same ones.
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The browser bindings the crate uses. CloseEvent, Document, Event, EventTarget, MessageEvent,
# VisibilityState and WebSocket are for the SignalR client (src/signalr).
web-sys = { version = "0.3", features = [
    "CloseEvent", "Document", "Event", "EventTarget", "Location", "MessageEvent", "VisibilityState",
    "WebSocket", "Window",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
# The SignalR client uses wasm-bindgen's `Closure` for the WebSocket and timer callbacks, and
# futures-core's `Stream` trait for hub streams.
wasm-bindgen = "0.2"
futures-core = "0.3"
