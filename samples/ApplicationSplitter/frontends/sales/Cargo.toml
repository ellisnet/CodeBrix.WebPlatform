[package]
name = "splitter-sales"
version = "0.1.0"
edition = "2021"
publish = false
description = "The sales frontend application of the ApplicationSplitter sample: Rust and Dioxus compiled to WebAssembly."
license = "Apache-2.0"

[dependencies]
# The platform's shared crate (the one set-up call, REST transport, SignalR client), written
# into `platform/` by the build program; the generated client code (src/generated) uses it.
codebrix-webplatform = { path = "platform/codebrix-webplatform" }
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "web", "router", "document", "mounted", "asset", "wasm-split"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Location", "Performance", "Window"] }

[features]
# Hot reload for `dx serve`; never enabled for a build that ships.
devtools = ["dioxus/devtools"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# No `strip`: wasm-bindgen needs the custom sections the linker writes; wasm-opt shrinks the file afterwards.
