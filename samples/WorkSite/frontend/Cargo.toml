[package]
name = "worksite-frontend"
version = "0.1.0"
edition = "2021"
publish = false
description = "The WorkSite web frontend: Rust and Dioxus compiled to WebAssembly."
license = "Apache-2.0"

[dependencies]
# The platform's shared crate (the one set-up call, REST transport, SignalR client, error type,
# query strings, dates, browser helpers), written into `platform/` by the frontend build; the
# generated client code (src/generated) uses it.
codebrix-webplatform = { path = "platform/codebrix-webplatform" }
dioxus ={ version = "=0.7.10", default-features = false, features = ["minimal", "web", "router", "document", "mounted", "asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already part of the Dioxus dependency tree. Named here to switch on the browser bindings this
# application and dioxus-web's router history need (dioxus-web 0.7.10 uses `Location` without
# enabling it unless its `devtools` feature is on). The shared crate switches on what its own
# code (the SignalR client among it) needs.
web-sys = { version = "0.3", features = [
    "Document", "DomTokenList", "Element", "HtmlElement", "Location", "Window",
] }

[features]
# Hot reload for `dx serve`; never enabled for a build that ships.
devtools = ["dioxus/devtools"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# No `strip`: wasm-bindgen needs the custom sections the linker writes; wasm-opt shrinks the file afterwards.
